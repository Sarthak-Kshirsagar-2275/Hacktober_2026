name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Syntax and JSON Validity Checks
        run: |
          python -m py_compile backend/main.py backend/scorer.py backend/test_scorer.py backend/test_api.py
          python -m json.tool examples/sample_input.json > /dev/null
          python -m json.tool examples/sample_output.json > /dev/null

      - name: Run Automated Unit and API Tests
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend -p "test_*.py" -v
